name: GIZMO Second Brain

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: GIZMO command to run
        required: false
        default: /gizmo status

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  GIZMO_WORKSPACE: .gizmo_runtime/github-action

jobs:
  second-brain:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.comment.body, '/gizmo')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Run GIZMO command
        id: gizmo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMMAND='${{ inputs.command }}'
          else
            COMMAND='${{ github.event.comment.body }}'
          fi
          python -m gizmo.core.cli second-brain-demo --workspace "$GIZMO_WORKSPACE" --comment "$COMMAND" > gizmo-response.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('gizmo-response.json').read_text())
          body=data.get('response_markdown') or 'GIZMO command completed.'
          Path('gizmo-response.md').write_text(body)
          print('command_status=' + data.get('status', 'OK'))
          PY
      - name: Upload response artifact
        uses: actions/upload-artifact@v4
        with:
          name: gizmo-second-brain-response
          path: |
            gizmo-response.json
            gizmo-response.md
      - name: Comment response
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gizmo-response.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
