name: GIZMO Cloud Brain 24-7

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: Telegram chat ID for cycle summary; defaults to TELEGRAM_ADMIN_ID
        required: false
        default: ''
  schedule:
    - cron: '7 * * * *'

concurrency:
  group: gizmo-cloud-brain
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  cloud-brain-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      REAPER_AUTH_SECRET: ${{ secrets.REAPER_AUTH_SECRET }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GIZMO_NOTIFICATION_MIN_PRIORITY: IMPORTANT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore cloud brain storage
        uses: actions/cache/restore@v4
        with:
          path: .gizmo_cloud_brain
          key: gizmo-cloud-brain-${{ github.run_id }}
          restore-keys: |
            gizmo-cloud-brain-
      - name: Install GIZMO
        run: python -m pip install -e . pytest
      - name: Run cloud multi-agent brain cycle
        env:
          INPUT_CHAT_ID: ${{ inputs.chat_id }}
        run: |
          mkdir -p .gizmo_cloud_brain/action-results
          chat_id="$INPUT_CHAT_ID"
          if [ -z "$chat_id" ]; then chat_id="$TELEGRAM_ADMIN_ID"; fi
          python -m gizmo.core.cli cloud-brain-cycle \
            --workspace .gizmo_cloud_brain \
            --chat-id "$chat_id" \
            --text on \
            > .gizmo_cloud_brain/action-results/cloud-brain-cycle.json
      - name: Send Telegram cloud brain summary
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ADMIN_ID != '' }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          from pathlib import Path
          result=json.loads(Path('.gizmo_cloud_brain/action-results/cloud-brain-cycle.json').read_text())
          text=result.get('notification') or f"GIZMO cloud brain cycle: {result.get('status')}"
          payload={"chat_id": os.environ['TELEGRAM_ADMIN_ID'], "text": text[:3900]}
          req=urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=json.dumps(payload).encode(),
              method='POST',
              headers={'Content-Type':'application/json'},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              print(json.dumps({'telegram_status': response.status, 'cycle_status': result.get('status')}))
          PY
      - name: Verify safety
        run: python -m pytest -q && python scripts/scan_secrets.py
      - name: Save cloud brain storage
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .gizmo_cloud_brain
          key: gizmo-cloud-brain-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-brain-cycle-result
          path: |
            .gizmo_cloud_brain/action-results/cloud-brain-cycle.json
            .gizmo_cloud_brain/cloud/brain_snapshot.json
            .gizmo_cloud_brain/cloud/brain_history.json
            .gizmo_cloud_brain/second_brain/structured/semantic/index_report.json
            .gizmo_cloud_brain/body/scorecard.json
            .gizmo_cloud_brain/body/next_queue.json
            .gizmo_cloud_brain/knowledge/latest_ingestion.json
            .gizmo_cloud_brain/knowledge/app_opportunities.json
            .gizmo_cloud_brain/apps/latest_factory_report.json
            .gizmo_cloud_brain/apps/blueprint_backlog.json
            .gizmo_cloud_brain/ideas/latest_thinking.json
            .gizmo_cloud_brain/ideas/upgrade_queue.json
            .gizmo_cloud_brain/ideas/chosen_next.json
            .gizmo_cloud_brain/apps/latest_prototype_report.json
            .gizmo_cloud_brain/apps/prototype_review_queue.json
            .gizmo_cloud_brain/apps/prototypes/**
