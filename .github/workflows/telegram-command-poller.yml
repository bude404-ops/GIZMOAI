name: GIZMO Telegram Live Responder

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: gizmo-telegram-live-responder
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  live-telegram-responder:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
      REAPER_AUTH_SECRET: ${{ secrets.REAPER_AUTH_SECRET }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GIZMO_NOTIFICATION_MIN_PRIORITY: LOW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GIZMO
        run: python -m pip install -e . pytest
      - name: Keep Telegram responder online
        run: |
          mkdir -p .gizmo_runtime/action-results
          python -m gizmo.core.cli telegram-poll-loop \
            --workspace .gizmo_runtime/telegram-live-responder \
            --duration-seconds 1200 \
            --poll-timeout 25 \
            > .gizmo_runtime/action-results/telegram-live-responder.json
      - name: Verify safety
        if: always()
        run: python scripts/scan_secrets.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-live-responder-result
          path: .gizmo_runtime/action-results/telegram-live-responder.json
